<!DOCTYPE html>
<html lang="it">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElBandito</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  :root {
    --nero: #0b0b0b; --carbone: #161616; --grafite: #222; --linea: #2e2e2e;
    --testo: #f2f2f2; --tenue: #9a9a9a; --accento: #fff;
    --verde: #7fd18b; --giallo: #e9c46a; --rosso: #e76f51; --blu: #8ab4f8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--nero); color: var(--testo);
    font: 15px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  a { color: var(--testo); }
  button, input, select, textarea { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 20; background: var(--nero); border-bottom: 1px solid var(--linea);
    display: flex; align-items: center; gap: 24px; padding: 14px 24px; flex-wrap: wrap; }
  .marchio { font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 13px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 6px 10px; color: var(--tenue); cursor: pointer;
    letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
  nav button.attivo, nav button:hover { color: var(--accento); }
  nav button.attivo { border-bottom: 1px solid var(--accento); }
  .azioni-testa { margin-left: auto; display: flex; gap: 8px; }
  main { padding: 24px; max-width: 1280px; margin: 0 auto; }
  h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--tenue); font-weight: 600; margin: 28px 0 10px; }
  h2:first-child { margin-top: 0; }
  .bottone { background: var(--grafite); border: 1px solid var(--linea); padding: 7px 12px; cursor: pointer; border-radius: 2px; }
  .bottone:hover { border-color: var(--tenue); }
  .bottone.pieno { background: var(--accento); color: var(--nero); border-color: var(--accento); }
  .bottone.piccolo { padding: 3px 8px; font-size: 12px; }
  input[type=text], input[type=search], input[type=date], input[type=number], select, textarea {
    background: var(--carbone); border: 1px solid var(--linea); padding: 7px 9px; border-radius: 2px; }
  textarea { width: 100%; min-height: 80px; resize: vertical; }

  .lista { display: grid; gap: 1px; background: var(--linea); border: 1px solid var(--linea); }
  .voce { background: var(--carbone); display: grid; grid-template-columns: 54px 1fr auto; gap: 14px; padding: 12px 14px; cursor: pointer; align-items: center; }
  .voce:hover { background: var(--grafite); }
  .voce.esclusa { opacity: .5; }
  .punti { font-size: 20px; font-weight: 700; text-align: center; }
  .punti small { display: block; font-size: 10px; font-weight: 400; color: var(--tenue); letter-spacing: .08em; }
  .titolo { font-weight: 600; }
  .sotto { color: var(--tenue); font-size: 13px; }
  .destra { text-align: right; font-size: 13px; white-space: nowrap; }
  .etichetta { display: inline-block; font-size: 11px; padding: 1px 6px; border: 1px solid var(--linea); border-radius: 2px; color: var(--tenue); margin-right: 4px; }
  .etichetta.verde { color: var(--verde); border-color: var(--verde); }
  .etichetta.giallo { color: var(--giallo); border-color: var(--giallo); }
  .etichetta.rosso { color: var(--rosso); border-color: var(--rosso); }
  .vuoto { color: var(--tenue); padding: 14px; background: var(--carbone); border: 1px solid var(--linea); }

  .filtri { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .filtri input[type=search] { flex: 1 1 220px; }
  .commuta { display: inline-flex; border: 1px solid var(--linea); }
  .commuta button { background: none; border: 0; padding: 6px 10px; cursor: pointer; color: var(--tenue); }
  .commuta button.attivo { background: var(--grafite); color: var(--accento); }

  .colonne { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .colonna { background: var(--carbone); border: 1px solid var(--linea); min-height: 120px; }
  .colonna h3 { margin: 0; padding: 10px 12px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid var(--linea); display: flex; justify-content: space-between; }
  .carta { padding: 10px 12px; border-bottom: 1px solid var(--linea); cursor: pointer; }
  .carta:hover { background: var(--grafite); }

  .mese { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--linea); border: 1px solid var(--linea); }
  .mese .giorno { background: var(--carbone); min-height: 92px; padding: 6px; font-size: 12px; }
  .mese .giorno.fuori { opacity: .35; }
  .mese .giorno.oggi { outline: 1px solid var(--accento); outline-offset: -1px; }
  .mese .intest { background: var(--nero); padding: 6px; font-size: 11px; color: var(--tenue); text-transform: uppercase; letter-spacing: .1em; }
  .evento { display: block; margin-top: 3px; padding: 2px 4px; background: var(--grafite); border-left: 2px solid var(--accento); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .evento.dubbio { border-left-color: var(--giallo); }
  .evento.attivita { border-left-color: var(--blu); }
  #mappa .leaflet-tile-pane { filter: grayscale(1) invert(1) brightness(.85) contrast(.9); }
  #mappa { height: 560px; border: 1px solid var(--linea); background: var(--carbone); }

  table.dati { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.dati th, table.dati td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  table.dati th { color: var(--tenue); font-weight: 500; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }

  .pannello { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--carbone); border-left: 1px solid var(--linea);
    transform: translateX(100%); transition: transform .2s ease; z-index: 50; overflow-y: auto; padding: 22px 24px 60px; }
  .pannello.aperto { transform: none; }
  .chiudi { position: absolute; top: 14px; right: 16px; background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--tenue); }
  .pannello h1 { font-size: 21px; margin: 4px 30px 4px 0; line-height: 1.25; }
  .conto { font-size: 30px; font-weight: 700; }
  .griglia { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 14px; }
  .griglia dt { color: var(--tenue); }
  .griglia dd { margin: 0; }
  .barra { display: grid; grid-template-columns: 90px 1fr 34px; gap: 8px; align-items: center; font-size: 12px; color: var(--tenue); margin: 3px 0; }
  .barra span.fondo { height: 4px; background: var(--grafite); position: relative; }
  .barra span.fondo i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accento); }
  .citazione { border-left: 2px solid var(--linea); padding: 4px 10px; color: var(--tenue); font-style: italic; font-size: 13px; margin: 8px 0; }
  .avviso { padding: 8px 10px; border: 1px solid var(--giallo); color: var(--giallo); font-size: 13px; margin: 10px 0; }
  .avviso.rosso { border-color: var(--rosso); color: var(--rosso); }
  .checklist label { display: flex; gap: 8px; padding: 4px 0; cursor: pointer; }
  .riga-azioni { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .velo { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; display: none; }
  .velo.aperto { display: block; }
  .messaggio { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--accento); color: var(--nero); padding: 8px 14px; z-index: 90; display: none; font-size: 14px; }
  .bozza { white-space: pre-wrap; background: var(--nero); border: 1px solid var(--linea); padding: 12px; font-size: 14px; }
  .caricamento { color: var(--tenue); padding: 40px; text-align: center; }

  .apri-filtri { display: none; }
  .solo-mobile { display: none; }
  .filtri-extra { display: contents; }
  .agenda { display: grid; gap: 1px; background: var(--linea); border: 1px solid var(--linea); }
  .agenda .giorno-agenda { background: var(--carbone); padding: 10px 12px; }
  .agenda .giorno-agenda.oggi { box-shadow: inset 3px 0 0 var(--accento); }
  .agenda .data-agenda { font-size: 12px; color: var(--tenue); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .agenda .evento { white-space: normal; padding: 6px 8px; margin-top: 6px; }

  @media (max-width: 720px) {
    header { padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); gap: 8px; flex-wrap: nowrap; }
    .marchio { font-size: 12px; }
    /* navigazione in basso, a portata di pollice */
    nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--nero); border-top: 1px solid var(--linea);
      flex-wrap: nowrap; overflow-x: auto; gap: 0; padding: 0 4px env(safe-area-inset-bottom); scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav button { flex: 1 0 auto; min-width: 66px; padding: 15px 10px; font-size: 11px; }
    nav button.attivo { border-bottom: 0; box-shadow: inset 0 2px 0 var(--accento); }
    main { padding: 14px 16px calc(84px + env(safe-area-inset-bottom)); }
    h2 { margin-top: 22px; }
    /* niente zoom automatico dell'iPhone quando si scrive; bersagli più grandi */
    input, select, textarea { font-size: 16px; }
    .bottone { min-height: 40px; }
    .bottone.piccolo { min-height: 34px; padding: 4px 10px; }
    .voce { grid-template-columns: 44px 1fr; gap: 10px; padding: 12px; }
    .voce .destra { grid-column: 2; text-align: left; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; white-space: normal; }
    .voce .destra .sotto { margin-left: auto; }
    .filtri input[type=search] { flex: 1 1 100%; }
    .apri-filtri { display: inline-flex; align-items: center; }
    .filtri-extra { display: none; }
    .filtri-extra.aperti { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
    .filtri-extra select, .filtri-extra input[type=number] { flex: 1 1 45%; width: auto !important; min-width: 0; }
    .commuta { display: flex; width: 100%; }
    .commuta button { flex: 1; padding: 10px; }
    .colonne { grid-auto-columns: 86vw; scroll-snap-type: x mandatory; }
    .colonna { scroll-snap-align: start; }
    #mappa { height: 62vh; }
    .pannello { width: 100%; border-left: 0; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
    .chiudi { position: sticky; top: 0; float: right; z-index: 2; width: 44px; height: 44px; margin: 6px -8px 0 0;
      background: var(--carbone); border-radius: 50%; }
    .pannello h1 { font-size: 19px; margin-top: 0; padding-top: 12px; }
    .riga-azioni .bottone { flex: 1 1 auto; text-align: center; display: inline-flex; align-items: center; justify-content: center; }
    .conto { font-size: 26px; }
    .messaggio { bottom: calc(72px + env(safe-area-inset-bottom)); max-width: 90vw; text-align: center; }
    /* tabelle → schede impilate */
    table.dati, table.dati tbody, table.dati tr, table.dati td, table.dati th { display: block; width: 100% !important; }
    table.dati tr:first-child:has(th + th) { display: none; }
    table.dati tr { border-bottom: 1px solid var(--linea); padding: 10px 0; }
    table.dati td, table.dati th { border: 0; padding: 3px 0; }
    table.dati th { color: var(--testo); text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 600; }
    .solo-desktop { display: none !important; }
    .solo-mobile { display: inline; }
    table.dati td[data-etichetta]::before { content: attr(data-etichetta) " · "; color: var(--tenue); font-size: 11px;
      text-transform: uppercase; letter-spacing: .06em; }
  }
</style>
</head>
<body>
<header>
  <div class="marchio">ElBandito</div>
  <nav id="nav">
    <button data-vista="oggi" class="attivo">Oggi</button>
    <button data-vista="esplora">Esplora</button>
    <button data-vista="pipeline">Pipeline</button>
    <button data-vista="calendario">Calendario</button>
    <button data-vista="enti">Enti</button>
    <button data-vista="fonti">Fonti</button>
    <button data-vista="profilo">Profilo</button>
  </nav>
  <div class="azioni-testa">
    <button class="bottone piccolo" onclick="apriAggiungiLink()">+ da link</button>
    <button class="bottone piccolo" onclick="apriAssistente()">Assistente</button>
  </div>
</header>
<main id="vista"><div class="caricamento">Carico i bandi…</div></main>
<div class="velo" id="velo" onclick="chiudiPannello()"></div>
<aside class="pannello" id="pannello"><button class="chiudi" onclick="chiudiPannello()" aria-label="Chiudi">×</button><div id="contenuto-pannello"></div></aside>
<div class="messaggio" id="messaggio"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
/* ------------------------------------------------------------------ stato */
var D = null;               // dati da getBandi()
var vista = 'oggi';
var filtri = { q: '', tipo: '', disciplina: '', paese: '', entro: '', quota: '', valore: '', minimo: '', esclusi: false, modo: 'lista' };
var meseCal = null;
var mappa = null;
var STATI_APERTI = ['Nuovo', 'Da preparare', 'Pronto'];

/* ------------------------------------------------------------------ server */
/** chiama('nomeFunzione', arg1, arg2…) → Promise, come nel gestionale. */
/* Tre backend, stessa interfaccia: Apps Script (google.script.run), dashboard locale
   (POST /api/<nome>, comando "elbandito dashboard") e dati d'esempio (?demo o file aperto da disco). */
var MODO = (typeof google !== 'undefined' && google.script) ? 'appsscript'
         : (location.protocol === 'file:' || /[?&]demo\b/.test(location.search)) ? 'demo' : 'locale';
function chiama(nome) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, ko) {
    var errore = function (e) { avvisa('Errore: ' + (e.message || e)); ko(e); };
    if (MODO === 'appsscript') { google.script.run.withSuccessHandler(ok).withFailureHandler(errore)[nome].apply(null, args); return; }
    if (MODO === 'demo') { ok(DEMO.risposta(nome, args)); return; }
    fetch('api/' + nome, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(args) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if ('ok' in j) ok(j.ok); else errore(new Error(j.errore || 'risposta non valida')); })
      .catch(function () { MODO = 'demo'; avvisa('Server locale non raggiungibile: mostro i dati d\'esempio'); ok(DEMO.risposta(nome, args)); });
  });
}

function carica(json) {
  D = typeof json === 'string' ? JSON.parse(json) : json;
  D.indice = {};
  D.bandi.forEach(function (b) { D.indice[b.ID] = b; });
  disegna();
  var aperto = document.getElementById('pannello').dataset.id;
  if (aperto && D.indice[aperto]) apriBando(aperto);
}

/* ------------------------------------------------------------------ utilità */
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function giorniA(iso) { if (!iso) return null; return Math.round((new Date(iso + 'T12:00:00') - new Date(D.oggi + 'T12:00:00')) / 864e5); }
function piuGiorni(iso, n) { var d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function dataBreve(iso) { if (!iso) return '—'; var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0].slice(2); }
function avvisa(t) { var m = document.getElementById('messaggio'); m.textContent = t; m.style.display = 'block'; clearTimeout(avvisa.t); avvisa.t = setTimeout(function () { m.style.display = 'none'; }, 3500); }
function num(v) { var n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; }
function aperto(b) { return STATI_APERTI.indexOf(b.Stato) >= 0; }

function etichettaScadenza(b) {
  var g = giorniA(b.Scadenza);
  if (g === null) return '<span class="etichetta">senza scadenza</span>';
  var cls = g <= 7 ? 'rosso' : g <= 21 ? 'giallo' : '';
  var dubbio = b['Scadenza confermata'] === 'sicura' ? '' : ' <span class="etichetta giallo" title="Data estratta dall\'AI: conferma sul sito">da verificare</span>';
  return '<span class="etichetta ' + cls + '">' + (g === 0 ? 'oggi' : g + ' gg') + '</span> ' + dataBreve(b.Scadenza) + dubbio;
}

function voce(b) {
  var luogo = [b['Città'], b.Paese].filter(Boolean).join(', ');
  var quota = b['Quota iscrizione'] === '' ? '' : (num(b['Quota iscrizione']) === 0 ? 'gratis' : b['Quota iscrizione'] + ' €');
  return '<div class="voce' + (b.Esclusione ? ' esclusa' : '') + '" onclick="apriBando(\'' + b.ID + '\')">' +
    '<div class="punti">' + esc(b.Punteggio || '–') + '<small>punti</small></div>' +
    '<div><div class="titolo">' + esc(b.Titolo) + '</div>' +
    '<div class="sotto">' + esc([b.Ente, b.Tipo, luogo, quota].filter(Boolean).join(' · ')) + '</div>' +
    (b.Esclusione ? '<div class="sotto" style="color:var(--rosso)">Escluso: ' + esc(b.Esclusione) + '</div>'
                  : (b.Motivazione ? '<div class="sotto">' + esc(b.Motivazione) + '</div>' : '')) + '</div>' +
    '<div class="destra">' + etichettaScadenza(b) + '<div class="sotto">' + esc(b.Stato) + '</div></div></div>';
}

function elenco(bandi, vuoto) {
  return bandi.length ? '<div class="lista">' + bandi.map(voce).join('') + '</div>' : '<div class="vuoto">' + (vuoto || 'Niente da mostrare.') + '</div>';
}

function perPunteggio(a, b) { return (num(b.Punteggio) || 0) - (num(a.Punteggio) || 0); }
function perScadenza(a, b) { return String(a.Scadenza || '9999').localeCompare(String(b.Scadenza || '9999')); }

/* ------------------------------------------------------------------ viste */
function disegna() {
  document.querySelectorAll('#nav button').forEach(function (b) { b.classList.toggle('attivo', b.dataset.vista === vista); });
  var el = document.getElementById('vista');
  if (mappa) { mappa.remove(); mappa = null; }
  el.innerHTML = ({ oggi: vistaOggi, esplora: vistaEsplora, pipeline: vistaPipeline, calendario: vistaCalendario,
                    enti: vistaEnti, fonti: vistaFonti, profilo: vistaProfilo })[vista]();
  if (vista === 'esplora' && filtri.modo === 'mappa') disegnaMappa(filtrati());
}

function vistaOggi() {
  var settimana = piuGiorni(D.oggi, -7);
  var nuovi = D.bandi.filter(function (b) { return b.Stato === 'Nuovo' && !b.Esclusione && b['Trovato il'] >= settimana; }).sort(perPunteggio);
  var vicini = D.bandi.filter(function (b) { var g = giorniA(b.Scadenza); return aperto(b) && !b.Esclusione && g !== null && g >= 0 && g <= 14; }).sort(perScadenza);
  var azioni = D.bandi.filter(function (b) { return b['Data prossima azione'] && b['Data prossima azione'] <= D.oggi && aperto(b) && b.Stato !== 'Nuovo'; }).sort(perScadenza);
  var mancanti = D.bandi.filter(function (b) {
    var c = D.candidature[b.ID];
    return (b.Stato === 'Da preparare' || b.Stato === 'Pronto') && c && c.Checklist.some(function (v) { return !v.fatto; });
  });
  return '<h2>Nuovi della settimana · ' + nuovi.length + '</h2>' + elenco(nuovi.slice(0, 15), 'Nessun bando nuovo negli ultimi 7 giorni.') +
    '<h2>Scadenze nei prossimi 14 giorni</h2>' + elenco(vicini, 'Nessuna scadenza vicina.') +
    '<h2>Prossime azioni</h2>' + elenco(azioni, 'Niente in ritardo.') +
    '<h2>Candidature con materiali mancanti</h2>' + elenco(mancanti, 'Tutte le checklist sono complete.');
}

function filtrati() {
  var q = filtri.q.toLowerCase();
  return D.bandi.filter(function (b) {
    if (!filtri.esclusi && b.Esclusione) return false;
    if (['Scartato', 'Vinto', 'Non selezionato'].indexOf(b.Stato) >= 0 && !filtri.esclusi) return false;
    if (q && JSON.stringify([b.Titolo, b.Ente, b.Temi, b['Città'], b.Paese, b.Valore, b.Motivazione]).toLowerCase().indexOf(q) < 0) return false;
    if (filtri.tipo && b.Tipo !== filtri.tipo) return false;
    if (filtri.disciplina && String(b.Disciplina).toLowerCase().indexOf(filtri.disciplina) < 0) return false;
    if (filtri.paese && b.Paese !== filtri.paese) return false;
    if (filtri.entro) { var g = giorniA(b.Scadenza); if (g === null || g > Number(filtri.entro)) return false; }
    if (filtri.quota !== '') { var qq = num(b['Quota iscrizione']); if (qq === null || qq > Number(filtri.quota)) return false; }
    if (filtri.minimo && (num(b.Punteggio) || 0) < Number(filtri.minimo)) return false;
    if (filtri.valore && !/\d/.test(b.Valore || '')) return false;
    return true;
  }).sort(perPunteggio);
}

function opzioni(valori, scelto, vuota) {
  return '<option value="">' + vuota + '</option>' + valori.map(function (v) { return '<option' + (v === scelto ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
}

function distanzaKm(lat1, lon1, lat2, lon2) {
  var R = 6371, r = Math.PI / 180, dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

function disegnaMappa(bandi) {
  var el = document.getElementById('mappa');
  if (!el || typeof L === 'undefined') return;
  var base = [num(D.profilo['Base lat']) || 44.4949, num(D.profilo['Base lon']) || 11.3426];
  if (!mappa) {
    mappa = L.map('mappa').setView([45, 12], 4);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>', maxZoom: 18 }).addTo(mappa);
    L.circleMarker(base, { radius: 7, color: '#fff', fillColor: '#fff', fillOpacity: 1 }).addTo(mappa).bindPopup(esc(D.profilo['Città di riferimento'] || 'Base'));
  }
  if (mappa._gruppo) mappa.removeLayer(mappa._gruppo);
  var gruppo = L.markerClusterGroup();
  bandi.forEach(function (b) {
    var lat = num(b.Lat), lon = num(b.Lon);
    if (lat === null || lon === null) return;
    var m = L.circleMarker([lat, lon], { radius: 6, color: '#fff', weight: 1, fillColor: b.Esclusione ? '#555' : '#e9c46a', fillOpacity: .9 });
    m.bindPopup('<b>' + esc(b.Titolo) + '</b><br>' + esc(b.Ente || '') + '<br>' + esc(b['Città'] || '') + ' · ' +
      distanzaKm(base[0], base[1], lat, lon) + ' km da ' + esc(D.profilo['Città di riferimento'] || 'casa') + '<br>Scadenza ' + dataBreve(b.Scadenza) +
      '<br><a href="#" onclick="apriBando(\'' + b.ID + '\');return false">Apri la scheda</a>');
    gruppo.addLayer(m);
  });
  mappa.addLayer(gruppo);
  mappa._gruppo = gruppo;
  setTimeout(function () { mappa.invalidateSize(); }, 50);
}

function griglia(bandi) {
  var mese = meseCal || D.oggi.slice(0, 7);

  var nomeMese = primo.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
  var inizio = new Date(primo); inizio.setDate(1 - ((primo.getDay() + 6) % 7));
  var eventi = {};
  bandi.forEach(function (b) {
    if (b.Scadenza) (eventi[b.Scadenza] = eventi[b.Scadenza] || []).push({ b: b, cls: b['Scadenza confermata'] === 'sicura' ? '' : 'dubbio', t: b.Titolo });
    if (b['Data prossima azione'] && b.Stato !== 'Nuovo') (eventi[b['Data prossima azione']] = eventi[b['Data prossima azione']] || []).push({ b: b, cls: 'attivita', t: '→ ' + b['Prossima azione'] + ': ' + b.Titolo });
  });
  var html = '<h2>' + nomeMese + '</h2><div class="mese">' + ['lun', 'mar', 'mer', 'gio', 'ven', 'sab', 'dom'].map(function (g) { return '<div class="intest">' + g + '</div>'; }).join('');
  for (var i = 0; i < 42; i++) {
    var d = new Date(inizio); d.setDate(inizio.getDate() + i);

  }
  return html + '</div>';
}

function chiudiPannello() {
  var p = document.getElementById('pannello');
  p.classList.remove('aperto'); delete p.dataset.id;
  document.getElementById('velo').classList.remove('aperto');
}

function azione(id, nome) {
  var extra = {};
  if (nome === 'inviato') { var d = prompt("Data dell'esito, se nota (aaaa-mm-gg). Lascia vuoto se non si sa:", ''); if (d === null) return; extra.dataEsito = d; }
  chiama('registraAzione', id, nome, extra).then(function (j) { carica(j); avvisa('Fatto'); });
}

function spunta(id, i, fatto) {
  var lista = D.candidature[id].Checklist; lista[i].fatto = fatto;
  chiama('salvaChecklist', id, lista).then(carica);
}
function aggiungiVoce(id) {
  var v = document.getElementById('nuovaVoce').value.trim(); if (!v) return;
  var lista = D.candidature[id].Checklist.concat([{ voce: v, fatto: false }]);
  chiama('salvaChecklist', id, lista).then(carica);
}

function bozzaStatement(id) {
  var el = document.getElementById('bozza');
  var indicazioni = prompt('Indicazioni per la bozza (progetto da proporre, tono…). Facoltativo:', '');
  if (indicazioni === null) return;
  el.innerHTML = '<p class="sotto">Scrivo la bozza…</p>';
  chiama('assistente', 'statement', indicazioni, id).then(function (j) {
    var r = JSON.parse(j);
    el.innerHTML = '<div class="bozza" id="testoBozza">' + esc(r.risposta) + '</div><div class="riga-azioni"><button class="bottone" onclick="navigator.clipboard.writeText(document.getElementById(\'testoBozza\').innerText);avvisa(\'Copiata\')">Copia</button><span class="sotto">Bozza da rivedere: non viene inviata a nessuno.</span></div>';
  });
}

/* ------------------------------------------------------------------ da link e assistente */
function apriAggiungiLink() {
  var url = prompt('Incolla il link di un bando, un post o una pagina:');
  if (!url) return;
  chiama('aggiungiDaLink', url.trim()).then(avvisa);
}

function apriAssistente() {
  var p = document.getElementById('pannello');
  delete p.dataset.id;
  document.getElementById('contenuto-pannello').innerHTML = '<h1>Assistente</h1><p class="sotto">Domande sui bandi del foglio. Le azioni proposte si applicano solo con ✓ Applica.</p>' +
    '<textarea id="domanda" placeholder="Es. residenze estive in Sud Europa con alloggio pagato e senza quota?"></textarea>' +
    '<div class="riga-azioni"><button class="bottone pieno" onclick="chiedi()">Chiedi</button></div><div id="risposta"></div>';
  p.classList.add('aperto'); document.getElementById('velo').classList.add('aperto');
  setTimeout(function () { document.getElementById('domanda').focus(); }, 50);
}

function chiedi() {
  var q = document.getElementById('domanda').value.trim(); if (!q) return;
  var el = document.getElementById('risposta'); el.innerHTML = '<p class="sotto">Penso…</p>';
  chiama('assistente', 'domanda', q).then(function (j) {
    var r = JSON.parse(j);
    var testo = esc(r.risposta).replace(/\b(B\d{4})\b/g, function (id) { return D.indice[id] ? '<a href="#" onclick="apriBando(\'' + id + '\');return false">' + id + '</a>' : id; });
    el.innerHTML = '<div class="bozza">' + testo + '</div>' + (r.azioni || []).map(function (a, i) {
      var b = D.indice[a.id]; if (!b) return '';
      return '<div class="avviso" style="display:flex;gap:10px;align-items:center;justify-content:space-between"><span>' + esc(a.azione) + ' → ' + esc(b.Titolo) + '<br><span class="sotto">' + esc(a.perche || '') + '</span></span>' +
        '<button class="bottone piccolo" onclick="this.disabled=true;chiama(\'registraAzione\',\'' + a.id + '\',\'' + a.azione + '\',{nota:\'assistente\'}).then(function(j){carica(j);avvisa(\'Applicato\')})">✓ Applica</button></div>';
    }).join('');
  });
}

/* ------------------------------------------------------------------ avvio */
document.getElementById('nav').addEventListener('click', function (e) {
  if (e.target.dataset.vista) { vista = e.target.dataset.vista; chiudiPannello(); disegna(); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') chiudiPannello(); });

});
