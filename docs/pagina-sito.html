<!--
  ElBandito — blocco da incollare in una pagina privata del tuo sito
  (WordPress: blocco "HTML personalizzato"; altri CMS: modalità HTML/codice).

  1. Sostituisci URL_WEB_APP con l'indirizzo della tua web app (finisce con /exec).
  2. Pubblica la pagina come nascosta: fuori dal menu, non indicizzata, meglio se protetta da password.
     La protezione vera resta Google: la web app si apre solo con il tuo account ("Solo io").
  3. Dentro il riquadro serve l'accesso a Google; se il browser lo blocca (Safari, Brave con
     i cookie di terze parti disattivati) usa il pulsante "Apri a schermo intero".
-->
<div class="elbandito">
  <div class="elbandito-barra">
    <strong>ElBandito</strong>
    <a class="elbandito-pulsante" href="URL_WEB_APP" target="_blank" rel="noopener">Apri a schermo intero ↗</a>
  </div>
  <iframe src="URL_WEB_APP" title="ElBandito" loading="lazy" allow="clipboard-write"></iframe>
  <p class="elbandito-nota">Non vedi niente qui sopra? Accedi a Google in questo browser, oppure usa "Apri a schermo intero".</p>
</div>
<style>
  .elbandito { max-width: 1400px; margin: 0 auto; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .elbandito-barra { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    background: #0b0b0b; color: #f2f2f2; padding: 10px 16px; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; }
  .elbandito-pulsante { color: #0b0b0b; background: #fff; padding: 6px 12px; text-decoration: none;
    letter-spacing: .04em; text-transform: none; font-size: 13px; border-radius: 2px; }
  .elbandito iframe { display: block; width: 100%; height: 85vh; min-height: 640px; border: 1px solid #222; background: #0b0b0b; }
  .elbandito-nota { color: #888; font-size: 13px; margin: 8px 0 0; }
</style>
