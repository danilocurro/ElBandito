[project]
name = "elbandito"
version = "0.2.0"
description = "Raccoglie, legge e ordina bandi, residenze, open call e premi per le arti visive."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ElBandito contributors" }]
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=1.12",
  "selectolax>=0.3.21",
  "extruct>=0.17",
  "dateparser>=1.2",
  "rapidfuzz>=3.9",
  "pydantic>=2.7",
  "gspread>=6.1",
  "anthropic>=0.60",
  "mcp>=1.9,<2",
]

[project.optional-dependencies]
browser = ["crawl4ai>=0.6"]
dev = ["pytest>=8"]

[project.scripts]
elbandito = "elbandito.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["elbandito"]

[tool.pytest.ini_options]
testpaths = ["tests"]
