name: Giro giornaliero

on:
  schedule:
    - cron: "0 4 * * *" # 06:00 ora legale italiana (05:00 in inverno)
  workflow_dispatch:

concurrency:
  group: elbandito-foglio # un solo giro alla volta scrive sul foglio
  cancel-in-progress: false

jobs:
  giro:
    # Spento finché non imposti la variabile ELBANDITO_ATTIVO = si (o sì) (Settings → Variables): niente errori quotidiani
    if: contains(fromJSON('["sì","si","Sì","Si","SI","true","1"]'), vars.ELBANDITO_ATTIVO) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Archivio SQLite
        uses: actions/cache@v4
        with:
          path: dati/archivio.sqlite
          key: archivio-${{ github.run_id }}
          restore-keys: archivio-
      - name: Giro delle fonti
        env:
          ELBANDITO_SHEET_ID: ${{ secrets.ELBANDITO_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m elbandito giornaliero -v
