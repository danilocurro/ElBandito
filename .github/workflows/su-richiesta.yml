name: Su richiesta dalla web app

# Avviato dalla web app (avviaCollettore in Codice.gs): "aggiungi da link",
# "cerca a fondo", "ricalcola", oppure un giro fuori orario.
on:
  workflow_dispatch:
    inputs:
      comando:
        description: "link | approfondisci | ricalcola | giornaliero | prepara | richiamo"
        required: true
        default: link
      argomento:
        description: "URL per link, ID del bando per approfondisci"
        required: false
        default: ""

concurrency:
  group: elbandito-foglio
  cancel-in-progress: false

jobs:
  esegui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Archivio SQLite
        uses: actions/cache@v4
        with:
          path: dati/archivio.sqlite
          key: archivio-${{ github.run_id }}
          restore-keys: archivio-
      - name: Esegui
        env:
          ELBANDITO_SHEET_ID: ${{ secrets.ELBANDITO_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMANDO: ${{ inputs.comando }}
          ARGOMENTO: ${{ inputs.argomento }}
        run: |
          case "$COMANDO" in
            link|approfondisci|ricalcola|giornaliero|prepara|richiamo) ;;
            *) echo "Comando non ammesso: $COMANDO"; exit 1 ;;
          esac
          python -m elbandito "$COMANDO" ${ARGOMENTO:+"$ARGOMENTO"} -v
