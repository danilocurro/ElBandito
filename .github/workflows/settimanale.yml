name: Giro settimanale con ricerca AI

on:
  schedule:
    - cron: "0 5 * * 1" # lunedì 07:00 ora legale italiana (06:00 in inverno)
  workflow_dispatch:

concurrency:
  group: elbandito-foglio
  cancel-in-progress: false

jobs:
  giro:
    # Spento finché non imposti la variabile ELBANDITO_ATTIVO = si (o sì) (Settings → Variables): niente errori quotidiani
    if: contains(fromJSON('["sì","si","Sì","Si","SI","true","1"]'), vars.ELBANDITO_ATTIVO) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180 # il batch Claude di solito finisce entro un'ora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Browser headless (solo se attivato)
        if: vars.USA_BROWSER == 'sì'
        run: |
          pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Archivio SQLite
        uses: actions/cache@v4
        with:
          path: dati/archivio.sqlite
          key: archivio-${{ github.run_id }}
          restore-keys: archivio-
      - name: Tutte le fonti + ricerca AI
        env:
          ELBANDITO_SHEET_ID: ${{ secrets.ELBANDITO_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
        run: python -m elbandito settimanale -v
      - name: Copia nei fogli condivisi (se ce ne sono)
        env:
          ELBANDITO_SHEET_ID: ${{ secrets.ELBANDITO_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ELBANDITO_FOGLI_CONDIVISI: ${{ secrets.ELBANDITO_FOGLI_CONDIVISI }}
        run: python -m elbandito sincronizza
